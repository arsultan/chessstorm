<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шахматные тренажёры</title>
<style>:root{--bg:#f3f1ea;--ink:#1f2620;--muted:#5f6857;--line:#dcd8cb;--panel:#fff;--accent:#2f6b3f}
@media (prefers-color-scheme:dark){:root{--bg:#141814;--ink:#e8ece4;--muted:#9aa595;--line:#2f382f;--panel:#1d231d;--accent:#6fbf7f}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}h1{margin:0 0 8px;font-size:30px}
a.card{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--accent)}a.card b{font-size:19px;display:block}a.card span{color:var(--muted)}</style></head>
<body><main><h1>Шахматные тренажёры</h1>
<a class="card" href="storm/"><b>Шахматный шторм</b><span>Решение позиций на время: Вудпекер, Конотоп и другие книги.</span></a>
<a class="card" href="debut/"><b>Дебютный справочник</b><span>Дерево ходов 76 дебютных репертуаров со ссылками на студии Lichess.</span></a>
</main></body></html>
